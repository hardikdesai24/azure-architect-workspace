[mcp_servers.ado]
command = "npx"
args = [
    "-y",
    "@azure-devops/mcp@2.9.0",
    "mercyhealthcare",
    "--authentication",
    "azcli",
]

[mcp_servers.azure]
command = "npx"
args = [
    "-y",
    "@azure/mcp@2.0.5",
    "server",
    "start",
]

[mcp_servers.azure.env]
AZURE_TOKEN_CREDENTIALS = "AzureCliCredential"

[mcp_servers.azure.tools.role]
approval_mode = "approve"

[mcp_servers.azure.tools.eventhubs]
approval_mode = "approve"

[mcp_servers.bicep]
command = "dnx"
args = [
    "-y",
    "Azure.Bicep.McpServer@0.46.1",
]

[mcp_servers.microsoft-learn]
url = "https://learn.microsoft.com/api/mcp"
